name: Gex Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gex-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, known revisions of the PSXRecomp framework and shared launcher UI.
  PSXRECOMP_SHA: 379565a6ffc2d399dcb53441dfb0e881ad39b043
  RECOMP_UI_SHA: 0546fbcb0126bb14bf88d2128b4fe8a4229570a3
  PSXRECOMP_URL: https://github.com/RetroPortingToolKit/psxrecomp.git
  RECOMP_UI_URL: https://github.com/RetroPortingToolKit/recomp-ui.git

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            shell: 'msys2 {0}'
          - os: macos-15
            artifact: macos-arm64
            shell: bash
            deployment_target: '11.0'
          - os: macos-15-intel
            artifact: macos-x64
            shell: bash
            deployment_target: '11.0'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}

    steps:
      - name: Checkout public project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            curl
            zip
            unzip
            jq
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-shaderc

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config sdl3 vulkan-headers shaderc molten-vk dylibbundler jq

      - name: Check required secrets
        shell: bash
        env:
          GEX_ASSETS_TOKEN: ${{ secrets.GEX_ASSETS_TOKEN }}
          DROPBOX_SHARED_URL: ${{ secrets.DROPBOX_SHARED_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GEX_ASSETS_TOKEN:-}" ]]; then
            echo "::error title=Missing Actions secret::Configure GEX_ASSETS_TOKEN using docs/BUILD_SETUP.md."
            exit 1
          fi
          # A Dropbox shared URL avoids OAuth setup. Otherwise use the private
          # OAuth refresh-token route if all three OAuth secrets are present.
          if [[ -z "${DROPBOX_SHARED_URL:-}" ]]; then
            for name in DROPBOX_APP_KEY DROPBOX_APP_SECRET DROPBOX_REFRESH_TOKEN; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error title=Missing Dropbox credential::Configure DROPBOX_SHARED_URL (easiest) or all three OAuth secrets described in docs/BUILD_SETUP.md."
                exit 1
              fi
            done
          fi

      - name: Checkout private asset metadata
        uses: actions/checkout@v4
        with:
          repository: NVDEMU/gexprivateassets
          token: ${{ secrets.GEX_ASSETS_TOKEN }}
          path: .private-assets
          fetch-depth: 1

      - name: Install PSXRecomp scaffolder at pinned revision
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          else
            TEMP_DIR="$RUNNER_TEMP"
          fi
          FRAMEWORK_CHECKOUT="$TEMP_DIR/psxrecomp-scaffold-source"
          rm -rf "$FRAMEWORK_CHECKOUT"
          git clone https://github.com/RetroPortingToolKit/psxrecomp.git "$FRAMEWORK_CHECKOUT"
          git -C "$FRAMEWORK_CHECKOUT" checkout "$PSXRECOMP_SHA"
          git -C "$FRAMEWORK_CHECKOUT" submodule update --init --recursive

          # The upstream scaffolder passes --psxrecomp-ref/--recomp-ui-ref
          # to "git submodule add -b", which accepts branch names, not raw SHAs.
          # It also hardcodes the CMake build version. Patch this temporary
          # checkout to pin the requested SHAs and stamp the matching nightly version.
          python3 - "$FRAMEWORK_CHECKOUT/tools/new_project_layout/setup_project.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old_submodules = "\n".join([
              'git submodule add -b "$PSXRECOMP_REF" "$PSXRECOMP_URL" psxrecomp',
              'if [ "$ENABLE_RECOMP_UI" -eq 1 ]; then',
              '    git submodule add -b "$RECOMP_UI_REF" "$RECOMP_UI_URL" recomp-ui',
              'fi',
              'git submodule update --init --recursive',
          ])
          new_submodules = "\n".join([
              'git submodule add -b master "$PSXRECOMP_URL" psxrecomp',
              'if [ "$ENABLE_RECOMP_UI" -eq 1 ]; then',
              '    git submodule add -b master "$RECOMP_UI_URL" recomp-ui',
              'fi',
              'git submodule update --init --recursive',
              '',
              '# git submodule add -b needs a branch name; pin SHAs after cloning.',
              'git -C psxrecomp fetch -q origin "$PSXRECOMP_REF"',
              'git -C psxrecomp checkout --detach -q "$PSXRECOMP_REF"',
              'git -C psxrecomp submodule update --init --recursive',
              'if [ "$ENABLE_RECOMP_UI" -eq 1 ]; then',
              '    git -C recomp-ui fetch -q origin "$RECOMP_UI_REF"',
              '    git -C recomp-ui checkout --detach -q "$RECOMP_UI_REF"',
              'fi',
          ])
          old_cmake = 'cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release'
          new_cmake = 'cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DPSX_GAME_VERSION="${RELEASE_VERSION:-0.1.0}"'
          if source.count(old_submodules) != 1:
              raise SystemExit("Could not safely patch the pinned PSXRecomp scaffolder's submodule block.")
          if old_cmake not in source:
              raise SystemExit("Could not find the pinned PSXRecomp scaffolder's CMake version setting.")
          source = source.replace(old_submodules, new_submodules, 1)
          # The same command text also appears in BUILD_HINT; replace every
          # occurrence so the executable build and printed hint remain aligned.
          source = source.replace(old_cmake, new_cmake)
          path.write_text(source)
          
          # Bash 3.2 (the system Bash on macOS runners) errors on empty-array
          # expansions with set -u. Guard BOTH the optional mod loop and its count.
          mac_packager = path.parents[2] / "tools/package_release_macos.sh"
          if not mac_packager.is_file():
              raise SystemExit("Pinned PSXRecomp macOS packager was not found.")
          package_source = mac_packager.read_text()
          safe_loop = 'for m in "${REQUIRE_MODS[@]-}"; do\n    [[ -n "$m" ]] || continue'
          safe_loop = 'for m in "${REQUIRE_MODS[@]-}"; do'
          if unsafe_loop in package_source:
              package_source = package_source.replace(unsafe_loop, safe_loop, 1)
          elif safe_loop not in package_source:
              raise SystemExit("Could not safely patch the pinned macOS packager required-mod loop with an empty-item guard.")
          unsafe_count = '[ ${#REQUIRE_MODS[@]} -eq 0 ] || note "mod catalog: ${#REQUIRE_MODS[@]} required package(s) present"'
          safe_count = 'if [[ -n "${REQUIRE_MODS[*]:-}" ]]; then note "mod catalog: required package(s) present"; fi'
          if unsafe_count in package_source:
              package_source = package_source.replace(unsafe_count, safe_count, 1)
          elif safe_count not in package_source:
              raise SystemExit("Could not safely patch the pinned macOS packager's empty-array count.")
          mac_packager.write_text(package_source)
          print("Patched macOS packager: safe empty-array loop, skips its empty fallback item, and guards count under Bash 3.2.")
          print("Patched scaffolder: pin exact framework SHAs and stamp the nightly version into CMake.")
          PY

          echo "FRAMEWORK_CHECKOUT=$FRAMEWORK_CHECKOUT" >> "$GITHUB_ENV"

      - name: Download and verify original disc from Dropbox
        shell: bash
        env:
          DROPBOX_SHARED_URL: ${{ secrets.DROPBOX_SHARED_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            WORKSPACE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            WORKSPACE_DIR="$GITHUB_WORKSPACE"
          fi
          ASSET_DIR="$WORKSPACE_DIR/.private-assets"
          CUE="$ASSET_DIR/Gex - Enter the Gecko.cue"
          BIN="$ASSET_DIR/Gex - Enter the Gecko.bin"
          test -s "$CUE" || { echo "::error::Private CUE file is missing from gexprivateassets."; exit 1; }

          if [[ -n "${DROPBOX_SHARED_URL:-}" ]]; then
            # Normalize a Dropbox share URL to a direct download URL without
            # printing the secret link into Actions logs.
            DOWNLOAD_URL="$(python3 - "$DROPBOX_SHARED_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          u = urlsplit(sys.argv[1])
          if u.scheme != "https" or u.hostname not in {"www.dropbox.com", "dropbox.com", "www.dropboxusercontent.com", "dropboxusercontent.com"}:
              raise SystemExit("DROPBOX_SHARED_URL must be a valid HTTPS Dropbox URL.")
          q = [(k, v) for k, v in parse_qsl(u.query, keep_blank_values=True) if k != "dl"]
          q.append(("dl", "1"))
          print(urlunsplit((u.scheme, u.netloc, u.path, urlencode(q), u.fragment)))
          PY
          )"
            curl --fail --silent --show-error --location "$DOWNLOAD_URL" --output "$BIN"
            unset DOWNLOAD_URL
          else
            AUTH_JSON="$(curl --fail --silent --show-error --user "${DROPBOX_APP_KEY}:${DROPBOX_APP_SECRET}" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=${DROPBOX_REFRESH_TOKEN}" \
              https://api.dropbox.com/oauth2/token)"
            DROPBOX_ACCESS_TOKEN="$(printf '%s' "$AUTH_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
            unset AUTH_JSON
            echo "::add-mask::${DROPBOX_ACCESS_TOKEN}"
            curl --fail --silent --show-error --location --request POST \
              --header "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}" \
              --header 'Dropbox-API-Arg: {"path": "/Gex - Enter the Gecko.bin"}' \
              --output "$BIN" \
              https://content.dropboxapi.com/2/files/download
            unset DROPBOX_ACCESS_TOKEN
          fi

          ACTUAL_SIZE="$(wc -c < "$BIN" | tr -d '[:space:]')"
          if [[ "$ACTUAL_SIZE" != "266662704" ]]; then
            echo "::error::Unexpected Gex BIN size: ${ACTUAL_SIZE} bytes (expected 266662704)."
            exit 1
          fi

          python3 - "$BIN" <<'PY'
          import hashlib, sys
          expected = "e7fdd511aae008e6d22b394dd18b775eda71ec8b2b3d90409679885a19718f1a"
          outer = hashlib.sha256()
          with open(sys.argv[1], "rb") as f:
              while True:
                  block = f.read(4 * 1024 * 1024)
                  if not block:
                      break
                  outer.update(hashlib.sha256(block).digest())
          actual = outer.hexdigest()
          if actual != expected:
              raise SystemExit("Dropbox content-hash mismatch; refusing to recompile an unexpected disc image.")
          print("Disc image verified against the private Dropbox manifest.")
          PY

      - name: Generate and build with PSXRecomp
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
            WORKSPACE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            TEMP_DIR="$RUNNER_TEMP"
            WORKSPACE_DIR="$GITHUB_WORKSPACE"
          fi
          ASSET_DIR="$WORKSPACE_DIR/.private-assets"
          PROJECTS_DIR="$TEMP_DIR/gex-projects"
          PROJECT="$PROJECTS_DIR/GexEnterTheGeckoRecomp"
          mkdir -p "$PROJECTS_DIR"
          rm -rf "$PROJECT"
          export PSXRECOMP_URL="$PSXRECOMP_URL"
          export RECOMP_UI_URL="$RECOMP_UI_URL"
          export RELEASE_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          bash "$FRAMEWORK_CHECKOUT/tools/new_project_layout/setup_project.sh" \
            --disc "$ASSET_DIR/Gex - Enter the Gecko.cue" \
            --dir "$PROJECTS_DIR" \
            --name GexEnterTheGeckoRecomp \
            --players 1 \
            --zip-prefix gex \
            --github-owner NVDEMU \
            --github-repo gexenterthegeckorecomp \
            --description "Native recompilation of Gex: Enter the Gecko (USA)" \
            --publisher "Crystal Dynamics / Midway" \
            --year 1998 \
            --region USA \
            --psxrecomp-ref "$PSXRECOMP_SHA" \
            --recomp-ui-ref "$RECOMP_UI_SHA" \
            --enable-recomp-ui \
            --enable-wizard \
            --no-netplay \
            --enable-ci \
            --no-fetch-boxart \
            --stage-disc \
            --generate \
            --enable-build \
            --no-github \
            --yes

          test -d "$PROJECT/build-release" || { echo "::error::PSXRecomp runtime build directory was not created."; exit 1; }
          test -f "$PROJECT/scripts/package_release.sh" || { echo "::error::PSXRecomp release packager was not generated."; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Package native build (without original game media)
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            WORKSPACE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            WORKSPACE_DIR="$GITHUB_WORKSPACE"
          fi
          cd "$PROJECT_DIR"
          # The built application needs a user's own disc at run time. Remove
          # the CI-only source media before invoking the official PSXRecomp packager.
          rm -rf disc
          export RELEASE_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          bash scripts/package_release.sh build-release "${{ matrix.artifact }}" build-recompiler
          mkdir -p "$WORKSPACE_DIR/dist"
          PACKAGE="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$PACKAGE" || { echo "::error::PSXRecomp packager produced no zip."; exit 1; }
          cp "$PACKAGE" "$GITHUB_WORKSPACE/dist/GexEnterTheGeckoRecomp-${{ matrix.artifact }}.zip"

      - name: Build verified macOS .app bundle and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # Use PSXRecomp's CMake OUTPUT_NAME marker instead of guessing or renaming an executable.
          BIN_MARKER="$PROJECT_DIR/build-release/psxrecomp_exe_name-psx-runtime.txt"
          test -s "$BIN_MARKER" || { echo "::error::PSXRecomp did not record the runtime executable name."; exit 1; }
          BIN_NAME="$(tr -d '[:space:]' < "$BIN_MARKER")"
          test -n "$BIN_NAME" || { echo "::error::PSXRecomp runtime executable name is empty."; exit 1; }
          GAME_BIN="$PROJECT_DIR/build-release/$BIN_NAME"
          test -f "$GAME_BIN" || { echo "::error::The named PSXRecomp executable is missing: $GAME_BIN"; ls -la "$PROJECT_DIR/build-release"; exit 1; }

          ARCHS="$(lipo -archs "$GAME_BIN")"
          echo "Built game executable: $BIN_NAME ($ARCHS)"
          case "${{ matrix.artifact }}" in
            macos-arm64)
              [[ " $ARCHS " == *" arm64 "* ]] || { echo "::error::Apple Silicon package does not contain arm64: $ARCHS"; exit 1; }
              ;;
            macos-x64)
              [[ " $ARCHS " == *" x86_64 "* ]] || { echo "::error::Intel package does not contain x86_64: $ARCHS"; exit 1; }
              ;;
            *)
              echo "::error::Unexpected macOS artifact name."; exit 1
              ;;
          esac

          # The generic PSXRecomp ZIP carries the game's runtime overlay compiler.
          # The framework packager creates the real bundle and validates linked libraries/signature.
          PACKAGE="$(find "$PROJECT_DIR/dist" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$PACKAGE" || { echo "::error::PSXRecomp runtime ZIP is missing."; exit 1; }
          UNPACKED="$RUNNER_TEMP/gex-macos-unpacked"
          rm -rf "$UNPACKED"
          mkdir -p "$UNPACKED"
          ditto -x -k "$PACKAGE" "$UNPACKED"
          test -d "$UNPACKED/overlay_toolchain" || { echo "::error::ZIP does not contain overlay_toolchain/."; exit 1; }
          test -s "$UNPACKED/psx_game_version.txt" || { echo "::error::ZIP does not contain psx_game_version.txt."; exit 1; }
          cp "$UNPACKED/psx_game_version.txt" "$PROJECT_DIR/psx_game_version.txt"

          # The pinned macOS packager requires the framework's third-party notices in the title tree.
          mkdir -p "$PROJECT_DIR/runtime/licenses"
          cp -R "$FRAMEWORK_CHECKOUT/runtime/licenses/." "$PROJECT_DIR/runtime/licenses/"

          APP_OUT="$RUNNER_TEMP/gex-macos-package"
          rm -rf "$APP_OUT"
          mkdir -p "$APP_OUT"
          bash "$FRAMEWORK_CHECKOUT/tools/package_release_macos.sh" \
            --repo "$PROJECT_DIR" \
            --build "$PROJECT_DIR/build-release" \
            --bin "$BIN_NAME" \
            --app-name "Gex Enter the Gecko" \
            --package "GexEnterTheGeckoRecomp" \
            --bundle-id "com.nvdemu.gexenterthegecko.recomp" \
            --version "$RELEASE_VERSION" \
            --out "$APP_OUT" \
            --game-config game.toml \
            --data psx_game_version.txt \
            --doc README.md \
            --no-zip \
            --no-dmg

          APP="$(find "$APP_OUT/stage" -type d -name 'Gex Enter the Gecko.app' -print -quit)"
          test -n "$APP" || { echo "::error::Official macOS packager did not produce the .app bundle."; find "$APP_OUT" -maxdepth 4 -print; exit 1; }

          # Preserve the overlay compiler files. A symlink from MacOS to Resources
          # keeps the runtime's executable-relative paths intact.
          mkdir -p "$APP/Contents/Resources/overlay_toolchain"
          cp -R "$UNPACKED/overlay_toolchain/." "$APP/Contents/Resources/overlay_toolchain/"
          ln -s "../Resources/overlay_toolchain" "$APP/Contents/MacOS/overlay_toolchain"

          # Re-sign after adding the overlay compiler and validate the finished bundle.
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --force --sign - "$candidate"
            fi
          done < <(find "$APP/Contents/Resources/overlay_toolchain" -type f -print0)
          codesign --force --sign - "$APP/Contents/MacOS/$BIN_NAME"
          codesign --force --sign - "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep "$APP" || { echo "::error::macOS app signature verification failed."; exit 1; }
          test -x "$APP/Contents/MacOS/Gex Enter the Gecko" || { echo "::error::App launcher shim is missing or not executable."; exit 1; }

          # ditto preserves the app bundle's resource metadata and symlinks.
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$GITHUB_WORKSPACE/dist/GexEnterTheGeckoRecomp-${{ matrix.artifact }}.app.zip"
          hdiutil create -volname "Gex Enter the Gecko" -srcfolder "$APP" -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/GexEnterTheGeckoRecomp-${{ matrix.artifact }}.dmg"
          echo "Verified .app bundle and created DMG for $ARCHS."

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: gex-${{ matrix.artifact }}
          path: |
            dist/GexEnterTheGeckoRecomp-${{ matrix.artifact }}.zip
            dist/GexEnterTheGeckoRecomp-${{ matrix.artifact }}.app.zip
            dist/GexEnterTheGeckoRecomp-${{ matrix.artifact }}.dmg
          if-no-files-found: error
          retention-days: 7

  publish-nightly:
    name: Publish Nightly release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: gex-*
          path: dist
          merge-multiple: true

      - name: Publish or replace Nightly
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: dist/*.zip,dist/*.dmg
          body: |
            Automated native builds of Gex: Enter the Gecko Recomp using PSXRecomp.
            Original game media is not included. Supply your own legally obtained disc.
            These builds are experimental; successful compilation does not establish full-game compatibility.
          token: ${{ secrets.GITHUB_TOKEN }}
